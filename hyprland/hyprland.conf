################
### MONITORS ###  https://wiki.hypr.land/Configuring/Monitors/
################

monitor = ,preferred,auto,1.25

###################
### MY PROGRAMS ###  https://wiki.hypr.land/Configuring/Keywords/
###################

$terminal = kitty
$fileManager = env GTK_THEME=HyprBlack thunar

#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = ~/.config/waybar/audio-device-watcher
exec-once = ~/.config/hypr/compact-workspaces.py
exec-once = nm-applet
exec-once = blueman-applet
exec-once = mako
exec-once = hyprpaper


#############################
### ENVIRONMENT VARIABLES ###  https://wiki.hypr.land/Configuring/Environment-variables/
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###  https://wiki.hypr.land/Configuring/Permissions/
###################

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###  https://wiki.hypr.land/Configuring/Variables/
#####################

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
#dwindle {
#    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
#    preserve_split = true # You probably want this
#}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###  https://wiki.hypr.land/Configuring/Variables/#input
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###  https://wiki.hypr.land/Configuring/Keywords/
###################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, escape, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, M, exec, env GTK_THEME=HyprBlack ~/.config/waybar/audio-menu
bind = $mainMod, F, exec, env GTK_THEME=HyprBlack firefox
bind = $mainMod, C, exec, code --ozone-platform-hint=wayland --enable-features=WaylandWindowDecorations
bind = $mainMod, O, exec, ~/.local/bin/obsidian.AppImage --ozone-platform-hint=wayland --enable-features=WaylandWindowDecorations
bind = $mainMod, K, exec, keepassxc
bind = $mainMod, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, B, exec, env GTK_THEME=HyprBlack blueman-manager
bind = $mainMod, N, exec, env GTK_THEME=HyprBlack nm-connection-editor

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + CTRL + [0-9]
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10

# Scroll through existing workspaces
bind = $mainMod CTRL, right, workspace, e+1
bind = $mainMod CTRL, left, workspace, e-1

# Laptop multimedia keys for volume and LCD brightness
bind = , F9, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###  https://wiki.hypr.land/Configuring/ Window-Rules/ Workspace-Rules/
##############################

# Keep Kitty windows tiled so dwindle can place them using the existing split behavior.
windowrule = tile on, match:class ^(kitty)$

# Open the NetworkManager and Bluetooth management windows as floating windows.
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = size 760 520, match:class ^(nm-connection-editor)$
windowrule = opacity 0.92 override 0.92 override 0.92 override, match:class ^(nm-connection-editor)$
windowrule = size 640 460, match:class ^(blueman-manager)$
windowrule = opacity 0.92 override 0.92 override 0.92 override, match:class ^(blueman-manager)$

# Keep Firefox's GTK file chooser (used for downloads) floating and centered.
windowrule = float on, match:title ^(Save File|Save As)$
windowrule = center on, match:title ^(Save File|Save As)$
# Firefox's downloads history opens as a separate window titled "Library".
windowrule = float on, match:class ^(firefox)$, match:title ^(Library)$
windowrule = center on, match:class ^(firefox)$, match:title ^(Library)$
windowrule = size 1000 700, match:class ^(firefox)$, match:title ^(Library)$
windowrule = opacity 0.92 override 0.92 override 0.92 override, match:class ^(firefox)$, match:title ^(Library)$
windowrule = float on, match:class ^(thunar|Thunar|org\.xfce\.Thunar)$
windowrule = size 900 620, match:class ^(thunar|Thunar|org\.xfce\.Thunar)$
windowrule = center on, match:class ^(thunar|Thunar|org\.xfce\.Thunar)$
windowrule = opacity 0.92 override 0.92 override 0.92 override, match:class ^(thunar|Thunar|org\.xfce\.Thunar)$
windowrule = float on, match:class ^(org\.dan\.AudioPicker|audio-picker|AudioPicker)$
windowrule = size 460 360, match:class ^(org\.dan\.AudioPicker|audio-picker|AudioPicker)$
windowrule = center on, match:class ^(org\.dan\.AudioPicker|audio-picker|AudioPicker)$
windowrule = opacity 0.92 override 0.92 override 0.92 override, match:class ^(org\.dan\.AudioPicker|audio-picker|AudioPicker)$
# Match by the fixed GTK title too, in case its Wayland app_id differs from the class.
windowrule = float on, match:title ^(Audio output)$
windowrule = size 460 360, match:title ^(Audio output)$
windowrule = center on, match:title ^(Audio output)$
windowrule = opacity 0.92 override 0.92 override 0.92 override, match:title ^(Audio output)$

